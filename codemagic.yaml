
workflows:
  android-build:
    name: UZFIR Extractor APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Extract UZFIR project
        script: |
          mkdir -p source
          unzip -q "Extractor baza1.zip" -d source

      - name: Prepare Flutter Android project
        script: |
          cd "source/Extractor baza1/flutter_extractor_app"
          flutter create --platforms=android --org uz.uzfir.extractor --project-name uzfir_db_extractor .
          flutter pub get

      - name: Build release APK
        script: |
          cd "source/Extractor baza1/flutter_extractor_app"
          flutter build apk --release

    artifacts:
      - "source/Extractor baza1/flutter_extractor_app/build/app/outputs/flutter-apk/app-release.apk"
      
